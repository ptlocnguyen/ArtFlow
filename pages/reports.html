<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Báo cáo | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/reports.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="reports" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar">
        <button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button>
        <div><p class="eyebrow">Hiệu quả bán hàng</p><h1><span data-page-title>Báo cáo</span><span class="report-heading-separator">/</span><span data-report-heading>Kinh doanh</span></h1></div>
        <div class="command-actions"><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div>
      </header>

      <section class="view active report-workspace">
        <section class="resource-index report-index">
          <div class="report-control-bar">
            <nav class="segmented-control report-view-switch" aria-label="Loại báo cáo">
              <button class="active" type="button" data-report-view="business">Kinh doanh</button>
              <button type="button" data-report-view="products">Sản phẩm</button>
              <button type="button" data-report-view="channels">Kênh bán</button>
              <button type="button" data-report-view="expenses">Chi phí</button>
            </nav>
            <div class="report-filters">
              <label><span>Thời gian</span><select data-report-range><option value="7">7 ngày</option><option value="30" selected>30 ngày</option><option value="90">90 ngày</option><option value="all">Toàn bộ</option></select></label>
              <label><span>Kênh bán</span><select data-report-channel><option value="all">Tất cả kênh</option><option value="pos">POS</option><option value="website">Website</option><option value="shopee">Shopee</option><option value="lazada">Lazada</option><option value="tiktok">TikTok Shop</option><option value="facebook">Facebook</option></select></label>
            </div>
            <div class="report-toolbar-meta"><span class="status-badge neutral" data-report-result-count>0 dòng</span><small data-report-comparison>So với kỳ trước</small></div>
            <button class="button primary report-export-button" type="button" data-export-profit-report title="Xuất báo cáo Excel"><span data-icon="download"></span><span>Xuất Excel</span></button>
          </div>

          <section class="report-table-panel" data-report-view-panel="business">
            <div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Đơn đã thanh toán</th><th>Doanh thu thuần</th><th>Giá vốn</th><th>Lãi gộp</th><th>Biên lãi</th></tr></thead><tbody data-business-report-table></tbody></table></div>
          </section>
          <section class="report-table-panel" data-report-view-panel="products" hidden>
            <div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Đã bán</th><th>Doanh thu</th><th>Giá vốn</th><th>Lãi gộp</th><th>Biên lãi</th></tr></thead><tbody data-product-profit-table></tbody></table></div>
          </section>
          <section class="report-table-panel" data-report-view-panel="channels" hidden>
            <div class="table-wrap"><table><thead><tr><th>Kênh</th><th>Đơn</th><th>Doanh thu</th><th>Giá vốn</th><th>Lãi gộp</th><th>Biên lãi</th></tr></thead><tbody data-channel-profit-table></tbody></table></div>
          </section>
          <section class="report-table-panel" data-report-view-panel="expenses" hidden>
            <div class="table-wrap"><table><thead><tr><th>Danh mục chi</th><th>Số giao dịch</th><th>Tổng chi</th><th>Tỷ trọng</th></tr></thead><tbody data-expense-report-table></tbody></table></div>
          </section>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui></div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/vendor/xlsx.bundle.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/channels.js"></script><script src="../assets/js/pages/team.js"></script><script src="../assets/js/pages/accounting.js"></script><script src="../assets/js/pages/purchasing.js"></script><script src="../assets/js/pages/suppliers.js"></script><script src="../assets/js/pages/reports.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
