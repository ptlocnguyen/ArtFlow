<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Khách hàng | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customers.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="customers" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar"><button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button><div><p class="eyebrow">CRM nhỏ gọn</p><h1 data-page-title>Khách hàng</h1></div><div class="command-actions"><label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm tên, số điện thoại, nhóm..." /></label><button class="button primary" type="button" data-open-customer><span data-icon="userPlus"></span> Thêm khách</button><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div></header>
      <section class="view active management-page">
        <section class="resource-index">
          <div class="panel-header split"><div><h2>Danh sách khách hàng</h2><p>Lưu thông tin liên hệ, nhóm khách và giá trị đã mua.</p></div><div class="row-actions"><button class="button ghost icon-only" type="button" data-export-customers title="Xuất Excel" aria-label="Xuất Excel"><span data-icon="download"></span></button><button class="button ghost icon-only" type="button" data-import-customers title="Nhập Excel" aria-label="Nhập Excel"><span data-icon="upload"></span></button><input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" data-customer-csv-file hidden /></div></div>
          <div class="table-wrap"><table><thead><tr><th>Khách hàng</th><th>Điện thoại</th><th>Nhóm</th><th>Đã mua</th><th>Lần cuối</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody data-customers-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui>
    <div class="modal-backdrop" data-modal-backdrop hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <div><p class="eyebrow" data-modal-eyebrow></p><h2 id="modal-title" data-modal-title></h2></div>
          <button class="icon-button" type="button" data-close-modal aria-label="Đóng"><span data-icon="close"></span></button>
        </header>
        <form class="form-grid" data-modal-form></form>
      </section>
    </div>
    <button class="menu-scrim" type="button" data-menu-close aria-label="Đóng menu"></button>
    <div class="toast" data-toast hidden></div>
    <div class="loading-overlay" data-loading-overlay hidden>
      <div class="loading-card" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><strong data-loading-text>Đang xử lý...</strong></div>
    </div>
  </div>
  <template data-customer-detail-template>
    <section class="customer-detail-hero full">
      <div class="customer-avatar" aria-hidden="true" data-customer-detail-avatar></div>
      <div><span class="badge" data-customer-detail-status></span><h3 data-customer-detail-name></h3><p data-customer-detail-group></p></div>
    </section>
    <section class="detail-metric-grid full">
      <article><span>Tổng đã mua</span><strong data-customer-detail-spent></strong></article>
      <article><span>Điểm thành viên</span><strong data-customer-detail-points></strong></article>
      <article><span>Số đơn</span><strong data-customer-detail-order-count></strong></article>
    </section>
    <section class="detail-section full">
      <h3>Liên hệ</h3>
      <dl class="detail-list">
        <div><dt>Điện thoại</dt><dd data-customer-detail-phone></dd></div>
        <div><dt>Email</dt><dd data-customer-detail-email></dd></div>
        <div><dt>Lần mua cuối</dt><dd data-customer-detail-last-order></dd></div>
      </dl>
    </section>
    <section class="detail-section full">
      <div class="detail-section-header"><h3>Đơn gần đây</h3><a href="./orders.html" data-customer-detail-orders-link>Xem danh sách</a></div>
      <div data-customer-detail-orders></div>
    </section>
    <section class="detail-section full"><h3>Ghi chú</h3><p class="customer-detail-note-value" data-customer-detail-note></p></section>
    <footer class="detail-sticky-actions" data-customer-detail-actions>
      <button class="button primary" type="button" data-edit-customer=""><span data-icon="edit"></span> Sửa khách hàng</button>
    </footer>
  </template>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/orders.js"></script><script src="../assets/js/pages/customers.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
