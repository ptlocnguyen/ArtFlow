<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kênh bán | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" /><link rel="stylesheet" href="../assets/css/app.css" /><link rel="stylesheet" href="../assets/css/components.css" /><link rel="stylesheet" href="../assets/css/operations.css" /><link rel="stylesheet" href="../assets/css/channels.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="channels" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar"><button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button><div class="channels-command-title"><p class="eyebrow">Kênh bán & tăng trưởng</p><div class="channels-title-line"><h1 data-page-title>Kênh bán</h1><span aria-hidden="true">/</span><strong>Ánh xạ SKU</strong></div></div><div class="command-actions"><label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm SKU nội bộ, SKU sàn, sản phẩm, kênh..." /></label><button class="button primary" type="button" data-open-channel-product-form><span data-icon="package"></span> Map SKU</button><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div></header>
      <section class="view active analytics-page channel-operations" data-omni-workspace>
        <section class="tiktok-connection-bar" data-tiktok-connection aria-live="polite">
          <div class="tiktok-connection-main">
            <span class="tiktok-mark" aria-hidden="true"><span data-icon="package"></span></span>
            <span class="tiktok-connection-copy">
              <strong data-tiktok-title>TikTok Shop</strong>
              <small data-tiktok-description>Kiểm tra cấu hình kết nối...</small>
            </span>
            <span class="status-chip" data-tiktok-status>Đang tải</span>
          </div>
          <div class="tiktok-connection-meta" data-tiktok-meta hidden></div>
          <div class="tiktok-connection-actions">
            <button class="button ghost" type="button" data-tiktok-sync-catalog hidden><span data-icon="refresh"></span> Đối chiếu SKU</button>
            <button class="button ghost" type="button" data-tiktok-sync-inventory hidden><span data-icon="warehouse"></span> Đồng bộ tồn</button>
            <button class="icon-button" type="button" data-tiktok-refresh hidden aria-label="Làm mới token TikTok" title="Làm mới token"><span data-icon="refresh"></span></button>
            <button class="button primary" type="button" data-tiktok-connect><span data-icon="external"></span> Kết nối</button>
            <button class="icon-button danger" type="button" data-tiktok-disconnect hidden aria-label="Ngắt kết nối TikTok Shop" title="Ngắt kết nối"><span data-icon="close"></span></button>
          </div>
        </section>
        <section class="panel operation-queue channels-panel">
          <h2 class="visually-hidden">Danh sách ánh xạ SKU</h2>
          <div class="channels-catalog-toolbar">
            <div class="saved-views channels-quick-filters" aria-label="Lọc nhanh ánh xạ SKU">
              <button class="active" type="button" data-omni-quick-filter="all">Tất cả</button>
              <button type="button" data-omni-quick-filter="missing">Chưa map</button>
              <button type="button" data-omni-quick-filter="mismatch">Lệch tồn</button>
              <button type="button" data-omni-quick-filter="out">Hết hàng</button>
              <button type="button" data-omni-quick-filter="reserved">Đang giữ</button>
            </div>
            <div class="channels-filter-fields">
              <label><span>Kênh</span><select data-omni-filter="channel" data-omni-channel-filter aria-label="Lọc theo kênh"><option value="all">Tất cả kênh</option></select></label>
              <label><span>Tồn kho</span><select data-omni-filter="stock" aria-label="Lọc theo tồn kho"><option value="all">Tất cả tồn kho</option><option value="low">Sắp hết</option><option value="out">Hết hàng</option><option value="reserved">Đang giữ hàng</option></select></label>
              <label><span>Vấn đề</span><select data-omni-filter="issue" aria-label="Lọc theo vấn đề"><option value="all">Tất cả vấn đề</option><option value="missing">Chưa map SKU</option><option value="mismatch">Lệch tồn</option></select></label>
            </div>
            <div class="channels-toolbar-actions">
              <span class="result-indicator" data-omni-result-count>0 sản phẩm</span>
              <a class="icon-button" href="./channel-settings.html" aria-label="Cấu hình kênh" title="Cấu hình kênh"><span data-icon="settings"></span></a>
              <button class="icon-button" type="button" data-export-omni aria-label="Xuất Excel" title="Xuất Excel"><span data-icon="download"></span></button>
            </div>
          </div>
          <div class="table-wrap omni-table-wrap channels-table-wrap"><table class="omni-table"><thead><tr><th>Sản phẩm</th><th>Tồn nội bộ</th><th>Khả dụng</th><th>Kênh đã map</th><th>Vấn đề</th><th>Thao tác</th></tr></thead><tbody data-omni-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui></div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/vendor/xlsx.bundle.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/channels.js"></script><script src="../assets/js/pages/team.js"></script><script src="../assets/js/pages/accounting.js"></script><script src="../assets/js/pages/purchasing.js"></script><script src="../assets/js/pages/suppliers.js"></script><script src="../assets/js/pages/reports.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
