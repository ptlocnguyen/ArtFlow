<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đơn hàng | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="orders" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar"><button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button><div><p class="eyebrow">Bán hàng</p><h1 data-page-title>Đơn hàng</h1></div><div class="command-actions"><label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm mã đơn, khách, SKU, mã vận đơn..." /></label><a class="button primary" href="./order-create.html" data-open-order><span data-icon="shoppingCart"></span> Tạo đơn</a><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div></header>
      <section class="view active operation-page">
        <section class="resource-index">
          <div class="resource-header"><div><h2>Danh sách đơn hàng</h2><p>Chọn một đơn để xem thanh toán, giao hàng và lịch sử xử lý.</p></div><button class="button ghost" type="button" data-popover-trigger="#order-filter-popover"><span data-icon="filter"></span> Bộ lọc</button></div>
          <div class="filter-bar popover" id="order-filter-popover" data-popover hidden>
            <label class="field"><span>Kênh</span><select data-order-channel-filter><option value="all">Tất cả kênh</option><option value="pos">POS</option><option value="website">Website</option><option value="shopee">Shopee</option><option value="lazada">Lazada</option><option value="tiktok">TikTok Shop</option><option value="facebook">Facebook</option></select></label>
            <label class="field"><span>Trạng thái</span><select data-order-status-filter><option value="all">Tất cả trạng thái</option><option value="pending">Chờ xử lý</option><option value="confirmed">Đã xác nhận</option><option value="packed">Đã đóng gói</option><option value="shipping">Đang giao</option><option value="paid">Đã thanh toán</option><option value="completed">Hoàn tất</option><option value="cancelled">Đã hủy</option></select></label>
            <label class="field"><span>Thanh toán</span><select data-order-payment-filter><option value="all">Tất cả thanh toán</option><option value="unpaid">Chưa thanh toán</option><option value="paid">Đã thanh toán</option><option value="refunded">Đã hoàn tiền</option></select></label>
            <label class="field"><span>Vận chuyển</span><select data-order-shipping-filter><option value="all">Tất cả vận chuyển</option><option value="none">Chưa giao</option><option value="preparing">Đang chuẩn bị</option><option value="shipping">Đang giao</option><option value="delivered">Đã giao</option><option value="returned">Hoàn hàng</option></select></label>
          </div>
          <div class="table-wrap"><table class="orders-table"><thead><tr><th>Mã đơn</th><th>Khách hàng/Kênh</th><th>Sản phẩm</th><th>Trạng thái</th><th>Thanh toán</th><th>Vận chuyển</th><th>Tổng tiền</th><th>Thao tác</th></tr></thead><tbody data-orders-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui></div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/channels.js"></script><script src="../assets/js/pages/team.js"></script><script src="../assets/js/pages/accounting.js"></script><script src="../assets/js/pages/purchasing.js"></script><script src="../assets/js/pages/suppliers.js"></script><script src="../assets/js/pages/reports.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
