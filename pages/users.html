<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhân viên | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/users.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="users" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar"><button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button><div class="users-command-title"><p class="eyebrow">Quản trị</p><div class="users-title-line"><h1 data-page-title>Nhân viên</h1><span aria-hidden="true">/</span><strong>Tài khoản nội bộ</strong></div></div><div class="command-actions"><label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm tên, email, vai trò..." /></label><button class="button primary" type="button" data-open-user><span data-icon="userPlus"></span> Thêm nhân viên</button><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div></header>
      <section class="view active users-workspace">
        <section class="panel users-panel">
          <h2 class="visually-hidden">Danh sách tài khoản nhân viên nội bộ</h2>
          <div class="users-toolbar">
            <div class="users-filters"><label><span>Vai trò</span><select data-user-role-filter><option value="all">Tất cả vai trò</option><option value="admin">Admin</option><option value="sales">Bán hàng</option><option value="inventory">Kho</option><option value="viewer">Chỉ xem</option></select></label><label><span>Trạng thái</span><select data-user-status-filter><option value="all">Tất cả trạng thái</option><option value="active">Đang hoạt động</option><option value="disabled">Đã khóa</option></select></label></div>
            <span class="users-result-count"><strong data-user-result-count>0</strong> tài khoản</span>
          </div>
          <div class="table-wrap users-table-wrap"><table class="users-table"><thead><tr><th>Nhân viên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Lần đăng nhập</th><th>Thao tác</th></tr></thead><tbody data-users-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui>
    <div class="modal-backdrop" data-modal-backdrop hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <div><p class="eyebrow" data-modal-eyebrow></p><h2 id="modal-title" data-modal-title></h2></div>
          <button class="icon-button" type="button" data-close-modal aria-label="Đóng"><span data-icon="close"></span></button>
        </header>
        <form class="form-grid" data-modal-form></form>
      </section>
    </div>
    <button class="menu-scrim" type="button" data-menu-close aria-label="Đóng menu"></button>
    <div class="toast" data-toast hidden></div>
    <div class="loading-overlay" data-loading-overlay hidden>
      <div class="loading-card" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><strong data-loading-text>Đang xử lý...</strong></div>
    </div>
  </div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/admin.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
