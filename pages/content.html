<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="content" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar">
        <button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button>
        <div><p class="eyebrow">Content workspace</p><h1 data-page-title>Content</h1></div>
        <div class="command-actions">
          <label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm chủ đề, sản phẩm, kênh..." /></label>
          <button class="button primary" type="button" data-open-content-item><span data-icon="plus"></span> Tạo chủ đề</button>
          <div class="user-chip" data-current-user></div>
          <button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button>
        </div>
      </header>

      <section class="view active content-workspace">
        <section class="popover content-control-panel" id="content-filter-popover" data-popover hidden>
          <div class="content-filter-bar">
            <label><span>Trạng thái</span><select data-content-filter="status" data-content-status-filter></select></label>
            <label><span>Loại</span><select data-content-filter="type" data-content-type-filter></select></label>
            <label><span>Kênh</span><select data-content-filter="channel" data-content-channel-filter></select></label>
            <label><span>Phụ trách</span><select data-content-filter="owner" data-content-owner-filter></select></label>
            <label><span>Sản phẩm</span><select data-content-filter="product" data-content-product-filter></select></label>
            <label><span>Lịch đăng</span><select data-content-filter="schedule" data-content-schedule-filter></select></label>
          </div>
        </section>

        <section class="content-layout">
          <section class="panel content-table-panel content-main-panel">
            <div class="panel-header split">
              <div><h2>Danh sách chủ đề</h2><p>Brief, deadline, người phụ trách, Docs/Drive và link đã đăng.</p></div>
              <div class="row-actions">
                <button class="button ghost" type="button" data-popover-trigger="#content-filter-popover"><span data-icon="filter"></span> Bộ lọc</button>
                <button class="button ghost" type="button" data-export-content><span data-icon="download"></span> Xuất báo cáo</button>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Chủ đề</th><th>Trạng thái</th><th>Kênh</th><th>Phụ trách</th><th>Deadline</th><th>Tài nguyên</th><th>Thao tác</th></tr>
                </thead>
                <tbody data-content-table></tbody>
              </table>
            </div>
          </section>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui></div>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/vendor/xlsx.bundle.js"></script>
  <script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/channels.js"></script><script src="../assets/js/pages/team.js"></script><script src="../assets/js/pages/accounting.js"></script><script src="../assets/js/pages/purchasing.js"></script><script src="../assets/js/pages/suppliers.js"></script><script src="../assets/js/pages/reports.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
