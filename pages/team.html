<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Hub | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/operations.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="team" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header">
          <div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div>
          <button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button>
        </header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar">
        <button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button>
        <div><p class="eyebrow">Làm việc nội bộ</p><h1 data-page-title>Team Hub</h1></div>
        <div class="command-actions">
          <label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm việc, cuộc họp, kế hoạch..." /></label>
          <button class="button primary" type="button" data-team-primary-action><span data-icon="plus"></span> Tạo việc</button>
          <div class="user-chip" data-current-user></div>
          <button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button>
        </div>
      </header>
      <section class="view active operation-page team-workspace">
        <section class="team-toolbar panel">
          <div class="team-tabs" role="tablist" aria-label="Không gian Team Hub">
            <button type="button" data-team-view="tasks" class="active"><span data-icon="check"></span> Việc cần làm</button>
            <button type="button" data-team-view="meetings"><span data-icon="clipboard"></span> Cuộc họp</button>
            <button type="button" data-team-view="plans"><span data-icon="chart"></span> Kế hoạch</button>
            <button type="button" data-team-view="decisions"><span data-icon="check"></span> Quyết định</button>
          </div>
          <div class="team-filter-bar">
            <label><span>Trạng thái</span><select data-team-status-filter></select></label>
            <label><span>Phụ trách</span><select data-team-owner-filter></select></label>
            <label><span>Thời gian</span><select data-team-range-filter><option value="all" selected>Toàn bộ thời gian</option><option value="7">7 ngày</option><option value="30">30 ngày</option><option value="90">90 ngày</option></select></label>
          </div>
        </section>
        <section class="panel team-main-panel">
          <div class="panel-header split">
            <div><h2 data-team-panel-title>Việc cần làm</h2><p data-team-panel-note>Tập trung các việc phát sinh từ họp, kênh bán, content và kho.</p></div>
            <div class="row-actions"><button class="button ghost icon-only" type="button" data-export-team aria-label="Xuất báo cáo"><span data-icon="download"></span></button></div>
          </div>
          <div data-team-content></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui></div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/vendor/xlsx.bundle.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/channels.js"></script><script src="../assets/js/pages/team.js"></script><script src="../assets/js/pages/accounting.js"></script><script src="../assets/js/pages/purchasing.js"></script><script src="../assets/js/pages/suppliers.js"></script><script src="../assets/js/pages/reports.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
