<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sản phẩm | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/products.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="products" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar"><button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button><div class="product-command-title"><p class="eyebrow">Danh mục</p><div class="product-title-line"><h1 data-page-title>Sản phẩm</h1><span aria-hidden="true">/</span><strong>Danh mục</strong></div></div><div class="command-actions"><label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm SKU, tên, danh mục..." /></label><button class="button primary" type="button" data-open-product><span data-icon="plus"></span> Thêm sản phẩm</button><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div></header>
      <section class="view active management-page">
        <section class="resource-index">
          <h2 class="visually-hidden">Danh mục sản phẩm</h2>
          <div class="product-catalog-toolbar">
            <div class="product-primary-filters">
              <label><span>Danh mục</span><select data-product-category-filter><option value="all">Tất cả danh mục</option></select></label>
              <label><span>Trạng thái</span><select data-product-status-filter><option value="all">Tất cả</option><option value="active">Đang bán</option><option value="archived">Ngừng bán</option></select></label>
              <label><span>Tồn kho</span><select data-product-stock-filter><option value="all">Tất cả</option><option value="out">Hết hàng</option><option value="low">Sắp hết</option><option value="healthy">Đủ hàng</option></select></label>
              <label><span>Sắp xếp</span><select data-product-sort><option value="name">Tên A-Z</option><option value="margin_desc">Biên lãi cao</option><option value="stock_asc">Tồn kho thấp</option><option value="price_desc">Giá bán cao</option><option value="updated_desc">Mới cập nhật</option></select></label>
            </div>
            <div class="product-catalog-actions"><span class="product-result-count"><b data-product-result-count>0</b> sản phẩm</span><button class="button ghost compact" type="button" data-popover-trigger="#product-filter-popover"><span data-icon="filter"></span> Nâng cao</button><button class="button ghost icon-only" type="button" data-open-product-options title="Quản lý thuộc tính" aria-label="Quản lý thuộc tính"><span data-icon="settings"></span></button><button class="button success icon-only" type="button" data-provision-missing-products title="Tạo tài nguyên hàng loạt" aria-label="Tạo tài nguyên hàng loạt"><span data-icon="folderPlus"></span></button><button class="button info icon-only" type="button" data-test-product-content title="Kiểm tra Drive" aria-label="Kiểm tra Drive"><span data-icon="test"></span></button><button class="button export icon-only" type="button" data-export-products title="Xuất Excel" aria-label="Xuất Excel"><span data-icon="download"></span></button><button class="button warning icon-only" type="button" data-import-products title="Nhập Excel" aria-label="Nhập Excel"><span data-icon="upload"></span></button><input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" data-product-csv-file hidden /></div>
          </div>
          <div class="product-filter-bar popover" id="product-filter-popover" data-popover hidden aria-label="Lọc sản phẩm">
            <label><span>Biên lãi</span><select data-product-margin-filter><option value="all">Tất cả</option><option value="loss">Không có lãi</option><option value="low">Dưới 20%</option><option value="good">20% - dưới 40%</option><option value="high">Từ 40%</option></select></label>
            <label><span>Content</span><select data-product-content-filter><option value="all">Tất cả</option><option value="not_started">Chưa bắt đầu</option><option value="drafting">Đang soạn</option><option value="review">Chờ duyệt</option><option value="ready">Sẵn sàng</option><option value="published">Đã đăng</option></select></label>
            <label><span>Tài nguyên</span><select data-product-assets-filter><option value="all">Tất cả</option><option value="complete">Đầy đủ</option><option value="missing">Còn thiếu</option></select></label>
            <button class="button ghost product-filter-reset" type="button" data-reset-product-filters>Đặt lại</button>
          </div>
          <div class="product-quick-filters" aria-label="Lọc nhanh sản phẩm">
            <span>Lọc nhanh</span>
            <button type="button" data-product-preset="all">Tất cả</button>
            <button type="button" data-product-preset="attention">Cần xử lý</button>
            <button type="button" data-product-preset="out">Hết hàng</button>
            <button type="button" data-product-preset="missing">Thiếu tài nguyên</button>
            <button type="button" data-product-preset="low_margin">Lãi thấp / âm</button>
          </div>
          <div class="table-wrap resource-content"><table class="products-table"><thead><tr><th>Sản phẩm</th><th>SKU</th><th>Giá bán</th><th>Tồn khả dụng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody data-products-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui>
    <div class="modal-backdrop" data-modal-backdrop hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <div><p class="eyebrow" data-modal-eyebrow></p><h2 id="modal-title" data-modal-title></h2></div>
          <button class="icon-button" type="button" data-close-modal aria-label="Đóng"><span data-icon="close"></span></button>
        </header>
        <form class="form-grid" data-modal-form></form>
      </section>
    </div>
    <button class="menu-scrim" type="button" data-menu-close aria-label="Đóng menu"></button>
    <div class="toast" data-toast hidden></div>
    <div class="loading-overlay" data-loading-overlay hidden>
      <div class="loading-card" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><strong data-loading-text>Đang xử lý...</strong></div>
    </div>
  </div>
  <template data-product-form-template>
    <div class="product-form-section full"><h3>Thông tin bán hàng</h3><p>Các trường dùng cho danh mục, kho và đơn hàng.</p></div>
    <div class="field"><label for="sku">SKU</label><input id="sku" name="sku" placeholder="AF-NEW-001" required /></div>
    <div class="field"><label for="name">Tên sản phẩm</label><input id="name" name="name" placeholder="Bộ cọ vẽ chi tiết" required /></div>
    <div class="field"><label for="category">Danh mục</label><select id="category" name="category" required></select></div>
    <div class="field"><label for="brand">Thương hiệu</label><select id="brand" name="brand"></select></div>
    <div class="field"><label for="barcode">Barcode / Mã vạch</label><input id="barcode" name="barcode" placeholder="893..." /></div>
    <div class="field"><label for="unit">Đơn vị tính</label><select id="unit" name="unit" required></select></div>
    <div class="field"><label for="costPrice">Giá vốn</label><input id="costPrice" name="costPrice" type="number" min="0" step="1000" required /></div>
    <div class="field"><label for="salePrice">Giá shop/offline hiện tại</label><input id="salePrice" name="salePrice" type="number" min="0" step="1000" placeholder="Có thể để trống và tính sau" /><small>Không bắt buộc khi tạo mới. Dùng Team Hub Pricing để tính và áp dụng giá chuẩn.</small></div>
    <div class="product-pricing-preview full" data-product-pricing-preview></div>
    <div class="field"><label for="stock">Tồn kho</label><input id="stock" name="stock" type="number" min="0" step="1" value="0" required /></div>
    <div class="field"><label for="lowStock">Ngưỡng cảnh báo</label><input id="lowStock" name="lowStock" type="number" min="0" step="1" value="1" required /></div>
    <div class="product-form-section full"><h3>Thông số sản phẩm</h3><p>Hữu ích khi viết mô tả và đăng lên sàn.</p></div>
    <div class="field"><label for="weightGrams">Khối lượng (gram)</label><input id="weightGrams" name="weightGrams" type="number" min="0" step="1" /></div>
    <div class="field"><label for="dimensions">Kích thước</label><input id="dimensions" name="dimensions" placeholder="20 x 10 x 5 cm" /></div>
    <div class="field"><label for="origin">Xuất xứ</label><input id="origin" name="origin" placeholder="Việt Nam" /></div>
    <div class="field"><label for="material">Chất liệu</label><input id="material" name="material" placeholder="Gỗ, cotton, nhựa ABS..." /></div>
    <div class="field full"><label for="imageUrl">Link ảnh đại diện</label><input id="imageUrl" name="imageUrl" type="url" placeholder="https://... (ảnh được chia sẻ để người xem có quyền truy cập)" /></div>
    <div class="product-form-section full"><h3>Quản lý content</h3><p>Brief nhanh để team content tìm, viết và theo dõi tiến độ.</p></div>
    <div class="field full"><label for="shortDescription">Mô tả ngắn</label><textarea id="shortDescription" name="shortDescription" rows="3" placeholder="Sản phẩm là gì và giải quyết nhu cầu nào?"></textarea></div>
    <div class="field full"><label for="keyFeatures">Điểm nổi bật / USP</label><textarea id="keyFeatures" name="keyFeatures" rows="4" placeholder="Mỗi điểm nổi bật một dòng"></textarea></div>
    <div class="field"><label for="targetAudience">Đối tượng khách hàng</label><input id="targetAudience" name="targetAudience" placeholder="Người mới học vẽ, sinh viên..." /></div>
    <div class="field"><label for="seoKeywords">Từ khóa tìm kiếm</label><input id="seoKeywords" name="seoKeywords" placeholder="cọ vẽ, cọ chi tiết, dụng cụ mỹ thuật" /></div>
    <div class="field"><label for="contentOwner">Người phụ trách content</label><select id="contentOwner" name="contentOwner"></select></div>
    <div class="field"><label for="contentStatus">Trạng thái content</label><select id="contentStatus" name="contentStatus"><option value="not_started">Chưa bắt đầu</option><option value="drafting">Đang soạn</option><option value="review">Chờ duyệt</option><option value="revision">Cần sửa</option><option value="ready">Sẵn sàng</option><option value="published">Đã đăng</option></select></div>
    <div class="field full"><label for="contentNote">Ghi chú content</label><textarea id="contentNote" name="contentNote" rows="3" placeholder="Yêu cầu hình ảnh, video, deadline, kênh ưu tiên..."></textarea></div>
    <div class="product-form-section full"><h3>Link bán hàng và bài content</h3><p>Tập hợp nơi sản phẩm đang được bán hoặc đã xuất hiện để team tra cứu nhanh.</p></div>
    <div class="field"><label for="websiteProductUrl">Link sản phẩm Website</label><input id="websiteProductUrl" name="websiteProductUrl" type="url" placeholder="https://website.vn/san-pham/..." /></div>
    <div class="field"><label for="shopeeProductUrl">Link sản phẩm Shopee</label><input id="shopeeProductUrl" name="shopeeProductUrl" type="url" placeholder="https://shopee.vn/..." /></div>
    <div class="field"><label for="tiktokProductUrl">Link sản phẩm TikTok Shop</label><input id="tiktokProductUrl" name="tiktokProductUrl" type="url" placeholder="https://shop.tiktok.com/..." /></div>
    <div class="field"><label for="facebookProductUrl">Link sản phẩm Facebook</label><input id="facebookProductUrl" name="facebookProductUrl" type="url" placeholder="https://facebook.com/..." /></div>
    <div class="field full"><label for="contentPostLinks">Các bài đăng / video liên quan</label><textarea id="contentPostLinks" name="contentPostLinks" rows="5" placeholder="TikTok hướng dẫn sử dụng | https://...&#10;Facebook launch sản phẩm | https://...&#10;Video review YouTube | https://..."></textarea><small>Mỗi dòng một link. Có thể dùng định dạng Tên bài | URL hoặc chỉ nhập URL.</small></div>
    <div class="product-resource-note full" data-product-form-resource-note>
      <span data-product-form-resource-edit hidden>Link Google Docs và Drive được hệ thống quản lý riêng. Dùng nút <strong>Tạo tài nguyên</strong> trong màn hình chi tiết nếu sản phẩm chưa có link.</span>
      <span data-product-form-resource-create>Sau khi lưu, hệ thống sẽ tự tạo Google Docs và các folder ảnh/video nếu Script Properties đã được cấu hình.</span>
    </div>
  </template>
  <template data-product-detail-template>
    <div class="product-detail-hero full">
      <img class="product-detail-image" src="" alt="" data-product-detail-image hidden />
      <div class="product-detail-image placeholder" data-product-detail-image-placeholder>Không có ảnh</div>
      <div>
        <span class="badge" data-product-detail-status></span><h3 data-product-detail-name></h3><p data-product-detail-identity></p>
        <b data-product-detail-shop-price></b><span class="price-status" data-product-detail-price-status></span>
        <div class="product-detail-actions" data-product-detail-actions>
          <button class="button info" type="button" data-edit-product-from-detail="" data-product-detail-edit>Sửa sản phẩm</button>
          <button class="button ghost" type="button" data-open-pricing-for-product="" data-product-detail-pricing>Tính giá</button>
        </div>
      </div>
    </div>
    <section class="product-detail-section full">
      <h3>Thông tin sản phẩm</h3>
      <div class="product-detail-grid">
        <div><span>Barcode</span><strong data-product-detail-barcode></strong></div><div><span>Đơn vị</span><strong data-product-detail-unit></strong></div>
        <div><span>Giá vốn</span><strong data-product-detail-cost></strong></div><div><span>Giá shop/offline</span><strong data-product-detail-sale-price></strong></div>
        <div><span>Lãi gộp / sản phẩm</span><strong data-product-detail-profit></strong></div><div><span>Biên lãi</span><strong data-product-detail-margin></strong></div>
        <div><span>Tỷ lệ cộng trên vốn</span><strong data-product-detail-markup></strong></div><div><span>Tồn kho</span><strong data-product-detail-stock></strong></div>
        <div><span>Khối lượng</span><strong data-product-detail-weight></strong></div><div><span>Kích thước</span><strong data-product-detail-dimensions></strong></div>
        <div><span>Xuất xứ</span><strong data-product-detail-origin></strong></div><div><span>Chất liệu</span><strong data-product-detail-material></strong></div>
        <div><span>Tạo lúc</span><strong data-product-detail-created></strong></div><div><span>Cập nhật lúc</span><strong data-product-detail-updated></strong></div>
        <div class="full" data-product-detail-channel-prices></div>
      </div>
    </section>
    <section class="product-detail-section full">
      <div class="section-heading-inline"><div><h3>Nhà cung cấp đã nhập</h3><p>Dữ liệu tự tổng hợp từ các phiếu mua đã nhận hàng.</p></div><span class="pill" data-product-detail-supplier-count>0 nhà cung cấp</span></div>
      <div data-product-detail-supplier-history></div>
    </section>
    <section class="product-detail-section full">
      <h3>Content</h3>
      <div class="product-detail-grid">
        <div><span>Trạng thái</span><strong data-product-detail-content-status></strong></div><div><span>Phụ trách</span><strong data-product-detail-content-owner></strong></div>
        <div><span>Đối tượng</span><strong data-product-detail-audience></strong></div><div><span>Từ khóa</span><strong data-product-detail-keywords></strong></div>
      </div>
      <div class="product-copy-block"><span>Mô tả ngắn</span><p data-product-detail-description></p></div>
      <div class="product-copy-block"><span>Điểm nổi bật / USP</span><p class="product-detail-prewrap" data-product-detail-features></p></div>
      <div class="product-copy-block"><span>Ghi chú</span><p class="product-detail-prewrap" data-product-detail-content-note></p></div>
    </section>
    <section class="product-detail-section full"><h3>Kênh bán và bài content</h3><div class="product-resource-grid" data-product-detail-sales-links></div><div data-product-detail-post-links></div></section>
    <section class="product-detail-section full">
      <h3>Tài nguyên Google</h3><div class="product-resource-grid" data-product-detail-google-links></div>
      <button class="button ghost" type="button" data-provision-product="" data-product-detail-provision hidden>Bổ sung tài nguyên còn thiếu</button>
    </section>
  </template>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/products.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
