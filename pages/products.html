<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sản phẩm | ArtFlow POS</title>
  <link rel="icon" href="../assets/images/artflow-pos-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/products.css" />
  <link rel="stylesheet" href="../assets/css/v3.css" />
</head>
<body data-page="products" data-root="..">
  <div class="app-shell" data-app-shell hidden>
    <aside class="app-navigation" aria-label="Điều hướng ứng dụng">
      <aside class="context-sidebar">
        <header class="context-header"><div class="context-brand"><small>Sales workspace</small><strong data-context-title>ArtFlow POS</strong></div><button class="icon-button context-close" type="button" data-context-close aria-label="Đóng điều hướng"><span data-icon="close"></span></button></header>
        <nav class="context-nav" aria-label="Điều hướng theo nghiệp vụ" data-nav-list></nav>
        <footer class="context-footer"><div class="context-connection"><span class="status-dot"></span><span>Đã kết nối qua Worker</span></div></footer>
      </aside>
    </aside>
    <main class="workspace">
      <header class="command-bar"><button class="icon-button command-mobile-toggle" type="button" data-context-toggle aria-label="Mở menu"><span data-icon="menu"></span></button><div class="product-command-title"><p class="eyebrow">Danh mục</p><div class="product-title-line"><h1 data-page-title>Sản phẩm</h1><span aria-hidden="true">/</span><strong>Danh mục</strong></div></div><div class="command-actions"><label class="search-box"><span data-icon="search"></span><input data-global-search type="search" placeholder="Tìm SKU, tên, danh mục..." /></label><button class="button primary" type="button" data-open-product><span data-icon="plus"></span> Thêm sản phẩm</button><div class="user-chip" data-current-user></div><button class="icon-button" type="button" data-logout aria-label="Đăng xuất"><span data-icon="logOut"></span></button></div></header>
      <section class="view active management-page">
        <section class="resource-index">
          <h2 class="visually-hidden">Danh mục sản phẩm</h2>
          <div class="product-catalog-toolbar">
            <div class="product-primary-filters">
              <label><span>Danh mục</span><select data-product-category-filter><option value="all">Tất cả danh mục</option></select></label>
              <label><span>Trạng thái</span><select data-product-status-filter><option value="all">Tất cả</option><option value="active">Đang bán</option><option value="archived">Ngừng bán</option></select></label>
              <label><span>Tồn kho</span><select data-product-stock-filter><option value="all">Tất cả</option><option value="out">Hết hàng</option><option value="low">Sắp hết</option><option value="healthy">Đủ hàng</option></select></label>
              <label><span>Sắp xếp</span><select data-product-sort><option value="name">Tên A-Z</option><option value="margin_desc">Biên lãi cao</option><option value="stock_asc">Tồn kho thấp</option><option value="price_desc">Giá bán cao</option><option value="updated_desc">Mới cập nhật</option></select></label>
            </div>
            <div class="product-catalog-actions"><span class="product-result-count"><b data-product-result-count>0</b> sản phẩm</span><button class="button ghost compact" type="button" data-popover-trigger="#product-filter-popover"><span data-icon="filter"></span> Nâng cao</button><button class="button ghost icon-only" type="button" data-open-product-options title="Quản lý thuộc tính" aria-label="Quản lý thuộc tính"><span data-icon="settings"></span></button><button class="button success icon-only" type="button" data-provision-missing-products title="Tạo tài nguyên hàng loạt" aria-label="Tạo tài nguyên hàng loạt"><span data-icon="folderPlus"></span></button><button class="button info icon-only" type="button" data-test-product-content title="Kiểm tra Drive" aria-label="Kiểm tra Drive"><span data-icon="test"></span></button><button class="button export icon-only" type="button" data-export-products title="Xuất Excel" aria-label="Xuất Excel"><span data-icon="download"></span></button><button class="button warning icon-only" type="button" data-import-products title="Nhập Excel" aria-label="Nhập Excel"><span data-icon="upload"></span></button><input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" data-product-csv-file hidden /></div>
          </div>
          <div class="product-filter-bar popover" id="product-filter-popover" data-popover hidden aria-label="Lọc sản phẩm">
            <label><span>Biên lãi</span><select data-product-margin-filter><option value="all">Tất cả</option><option value="loss">Không có lãi</option><option value="low">Dưới 20%</option><option value="good">20% - dưới 40%</option><option value="high">Từ 40%</option></select></label>
            <label><span>Content</span><select data-product-content-filter><option value="all">Tất cả</option><option value="not_started">Chưa bắt đầu</option><option value="drafting">Đang soạn</option><option value="review">Chờ duyệt</option><option value="ready">Sẵn sàng</option><option value="published">Đã đăng</option></select></label>
            <label><span>Tài nguyên</span><select data-product-assets-filter><option value="all">Tất cả</option><option value="complete">Đầy đủ</option><option value="missing">Còn thiếu</option></select></label>
            <button class="button ghost product-filter-reset" type="button" data-reset-product-filters>Đặt lại</button>
          </div>
          <div class="product-quick-filters" aria-label="Lọc nhanh sản phẩm">
            <span>Lọc nhanh</span>
            <button type="button" data-product-preset="all">Tất cả</button>
            <button type="button" data-product-preset="attention">Cần xử lý</button>
            <button type="button" data-product-preset="out">Hết hàng</button>
            <button type="button" data-product-preset="missing">Thiếu tài nguyên</button>
            <button type="button" data-product-preset="low_margin">Lãi thấp / âm</button>
          </div>
          <div class="table-wrap resource-content"><table class="products-table"><thead><tr><th>Sản phẩm</th><th>SKU</th><th>Giá bán</th><th>Tồn khả dụng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody data-products-table></tbody></table></div>
        </section>
      </section>
    </main>
  </div>
  <div data-shared-ui></div>
  <script src="../assets/js/config.js"></script><script src="../assets/js/data.js"></script><script src="../assets/js/core/data.js"></script><script src="../assets/js/storage.js"></script><script src="../assets/vendor/xlsx.bundle.js"></script><script src="../assets/js/core/ui.js"></script><script src="../assets/js/core/navigation.js"></script><script src="../assets/js/pages/channels.js"></script><script src="../assets/js/pages/team.js"></script><script src="../assets/js/pages/accounting.js"></script><script src="../assets/js/pages/purchasing.js"></script><script src="../assets/js/pages/suppliers.js"></script><script src="../assets/js/pages/reports.js"></script><script src="../assets/js/ui/app-shell.js"></script><script src="../assets/js/ui/side-sheet.js"></script><script src="../assets/js/ui/modal.js"></script><script src="../assets/js/ui/popover.js"></script><script src="../assets/js/ui/bottom-sheet.js"></script><script src="../assets/js/ui/command-menu.js"></script><script src="../assets/js/ui/data-table.js"></script><script src="../assets/js/ui/filter-bar.js"></script><script src="../assets/js/ui/toast.js"></script><script src="../assets/js/ui/confirm-dialog.js"></script><script src="../assets/js/app.js"></script>
</body>
</html>
